logger:
  level: "debug"

grpc:
  host: "localhost"
  port: "50053"
  max_connection_idle: "15m"
  max_connection_age: "30m"
  max_connection_age_grace: "5s"
  keepalive_time: "5m"
  keepalive_timeout: "1s"
  min_ping_interval: "5m"
  shutdown_timeout: "10s"

pg:
  host: "localhost"
  port: "5434"
  database: "iam-service"
  user: "iam-service-user"
  password: "iam-service-password"
  sslmode: "disable"

redis:
  host: "localhost"
  port: "6379"

session:
  ttl: "24h"
