syntax = "proto3";

// Package auth.v1 содержит сервис аутентификации.
package auth.v1;

option go_package = "github.com/PabloGolobaro/cosmic_factory/shared/pkg/proto/auth/v1;authv1";

import "buf/validate/validate.proto";
import "common/v1/common.proto";

// AuthService сервис аутентификации (вход, проверка сессии).
service AuthService {
  // Login выполняет вход в систему и создаёт сессию.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Whoami проверяет текущую сессию и возвращает информацию о пользователе.
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse);

  // Logout завершает сессию пользователя.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Authorize проверяет, разрешено ли владельцу сессии действие над ресурсом.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
}

// LoginRequest запрос на вход в систему.
message LoginRequest {
  // login логин пользователя.
  string login = 1;

  // password пароль пользователя.
  string password = 2;
}

// LoginResponse ответ на вход в систему.
message LoginResponse {
  // session_uuid UUID созданной сессии.
  string session_uuid = 1;
}

// WhoamiRequest запрос на проверку сессии.
message WhoamiRequest {
  // session_uuid UUID активной сессии.
  string session_uuid = 1;
}

// WhoamiResponse ответ с информацией о сессии и пользователе.
message WhoamiResponse {
  // session информация о текущей сессии.
  common.v1.Session session = 1;

  // user владелец сессии.
  common.v1.User user = 2;
}

// LogoutRequest запрос на завершение сессии.
message LogoutRequest {
  // session_uuid UUID сессии для завершения.
  string session_uuid = 1;
}

// LogoutResponse ответ на завершение сессии.
message LogoutResponse {}

// Resource атрибуты ресурса, над которым выполняется действие.
message Resource {
  // owner_uuid UUID владельца ресурса; пустой, если у действия нет ресурса (например, создание).
  string owner_uuid = 1 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

// AuthorizeRequest запрос на проверку прав.
message AuthorizeRequest {
  // session_uuid UUID активной сессии.
  string session_uuid = 1 [(buf.validate.field).string.min_len = 1];

  // action действие в формате "<ресурс>:<операция>", например "order:read".
  string action = 2 [(buf.validate.field).string.min_len = 1];

  // resource атрибуты ресурса.
  Resource resource = 3;
}

// AuthorizeResponse решение о доступе.
message AuthorizeResponse {
  // allowed разрешено ли действие.
  bool allowed = 1;

  // user_uuid UUID владельца сессии.
  string user_uuid = 2;

  // role роль владельца сессии.
  common.v1.Role role = 3;
}
