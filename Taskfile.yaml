version: '3'

vars:
  GO_VERSION: '1.26.0'
  GOLANGCI_LINT_VERSION: 'v2.11.2'
  GCI_VERSION: 'v0.14.0'
  GOFUMPT_VERSION: 'v0.9.2'
  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'

  GOOSE_VERSION: 'v3.27.0'
  GOOSE: '{{.BIN_DIR}}/goose'

  MODULES: assembly iam inventory order payment platform

includes:
  gen:
    taskfile: ./Taskfile.gen.yml
  test:
    taskfile: ./Taskfile.test.yml
  migrate:
    taskfile: ./migrations/Taskfile.yaml
  deploy:
    taskfile: ./deploy/Taskfile.yaml

tasks:
  build:
    desc: "Компилирует все модули"
    cmds:
      - for mod in {{.MODULES}}; do echo "=== $mod ===" && (cd "$mod" && go build ./...); done

  formatters:install:
    desc: "Устанавливает gofumpt и gci"
    cmds:
      - echo '📦 Устанавливаем gofumpt...'
      - GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
      - echo '📦 Устанавливаем gci...'
      - GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  golangci-lint:install:
    desc: "Устанавливает golangci-lint"
    cmds:
      - echo '📦 Устанавливаем golangci-lint...'
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    status:
      - test -x {{.GOLANGCI_LINT}}

  setup:
    desc: "Устанавливает все инструменты"
    deps: [ formatters:install, golangci-lint:install, gen:buf:install, gen:proto:install-plugins, gen:ogen:install ]

  format:
    desc: "Форматирует код (gofumpt + gci)"
    deps: [ formatters:install ]
    cmds:
      - echo '🧹 Форматируем код через gofumpt...'
      - find . -type f -name '*.go' ! -path '*/mocks/*' ! -path '*/pkg/proto/*' ! -path '*/pkg/openapi/*' -exec {{.GOFUMPT}} -extra -w {} +
      - echo '📦 Сортируем импорты через gci...'
      - find . -type f -name '*.go' ! -path '*/mocks/*' ! -path '*/pkg/proto/*' ! -path '*/pkg/openapi/*' -exec {{.GCI}} write -s standard -s default -s "prefix(github.com/PabloGolobaro/cosmic_factory)" {} +
      - echo '🔧 Применяем go fix...'
      - for mod in {{.MODULES}}; do (cd "$mod" && go fix ./...); done

  lint:
    desc: "Запускает golangci-lint"
    deps: [ golangci-lint:install ]
    cmds:
      - '{{.GOLANGCI_LINT}} run --allow-parallel-runners order/... inventory/... payment/... shared/... --config=.golangci.yml'

  deps:update:
    desc: "Обновляет зависимости"
    cmds:
      - echo '🔄 Синхронизируем go.work...'
      - go work sync
      - echo '🔄 Обновляем зависимости в модулях...'
      - for mod in {{.MODULES}}; do (cd "$mod" && go mod tidy -compat={{.GO_VERSION}}); done

  run:order:
    desc: "Запускает Order-сервис локально через go run"
    dir: order
    cmds:
      - go run ./cmd/main.go

  run:inventory:
    desc: "Запускает Inventory-сервис локально через go run"
    dir: inventory
    cmds:
      - go run ./cmd/main.go

  run:payment:
    desc: "Запускает Payment-сервис локально через go run"
    dir: payment
    cmds:
      - go run ./cmd/main.go

  run:assembly:
    desc: "Запускает Assembly-сервис локально через go run"
    dir: assembly
    cmds:
      - go run ./cmd/main.go


  run:iam:
    desc: "Запускает IAM-сервис локально через go run"
    dir: iam
    cmds:
      - go run ./cmd/main.go

  run:all:
    desc: "Запускает все сервисы параллельно"
    deps:
      - run:order
      - run:inventory
      - run:payment
      - run:assembly
      - run:iam

  goose:install:
    desc: "Устанавливает goose (миграции БД)"
    cmds:
      - echo '📦 Устанавливаем goose...'
      - GOBIN={{.BIN_DIR}} go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}
    status:
      - test -x {{.GOOSE}}



