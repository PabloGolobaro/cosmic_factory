name: Coverage

on:
  workflow_call:

jobs:
  coverage:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: '**/go.sum'

      - name: Cache task-installed binaries
        uses: actions/cache@v5.0.5
        with:
          path: bin
          key: ${{ runner.os }}-task-bin-${{ hashFiles('Taskfile.yaml') }}
          restore-keys: |
            ${{ runner.os }}-task-bin-

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Run tests with coverage
        run: task test:coverage

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage/coverage.out | tail -n1 | awk '{print $NF}' | tr -d '%')
          echo "value=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Determine badge color
        id: color
        run: |
          COV=${{ steps.coverage.outputs.value }}
          if (( $(echo "$COV >= 80" | bc -l) )); then
            echo "value=brightgreen" >> $GITHUB_OUTPUT
          elif (( $(echo "$COV >= 60" | bc -l) )); then
            echo "value=yellow" >> $GITHUB_OUTPUT
          elif (( $(echo "$COV >= 40" | bc -l) )); then
            echo "value=orange" >> $GITHUB_OUTPUT
          else
            echo "value=red" >> $GITHUB_OUTPUT
          fi

      - name: Update coverage gist
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 989a2757665014f43115badfbc137219
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.value }}%
          color: ${{ steps.color.outputs.value }}
